# .github/workflows/deploy-dev.yml
#
# Deploys hcri.io's `develop` branch to the dev.hcri.io staging site on
# every push to `develop`. Mirrors deploy.yml (which deploys `master` to
# production) -- see that file for the fuller explanation of how the
# fast-forward-only merge behaves and why no build/migration step runs here.
#
# Reuses the same SSH connection secrets as the production workflow (same
# server, same account) -- only the target path and branch differ.
#
# Additional required repo secret beyond the ones deploy.yml already needs:
#   SPACESHIP_DEV_PATH - absolute path to the dev site's document root,
#                         e.g. /home/dcvgnomgak/dev.hcri.io
#
# Also builds frontend/ (Vite) and commits the minified output back to
# `develop` before deploying -- see deploy.yml's build-frontend job for the
# full explanation (this one's identical, just targeting `develop`).
#
# One-time repo setting this relies on: Settings -> Actions -> General ->
# "Workflow permissions" must be "Read and write permissions" -- otherwise
# build-frontend's push-back step gets a 403.

name: Deploy to Spaceship (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (minified, into assets/)
        working-directory: frontend
        run: npm run build

      # See deploy.yml's build-frontend job for why this stages exact
      # filenames rather than the whole assets/ directory.
      - name: Commit built assets if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/app.css assets/favicon.svg assets/icons.svg
          if git diff --cached --quiet; then
            echo "No build output changes."
          else
            git commit -m "Build frontend assets [skip ci]"
            git push origin develop
          fi

  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: git fetch + fast-forward on dev server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SPACESHIP_HOST }}
          port: ${{ secrets.SPACESHIP_PORT }}
          username: ${{ secrets.SPACESHIP_USER }}
          key: ${{ secrets.SPACESHIP_SSH_KEY }}
          passphrase: ${{ secrets.SPACESHIP_SSH_PASSPHRASE }}
          script: |
            set -e
            cd "${{ secrets.SPACESHIP_DEV_PATH }}"
            git fetch origin develop
            git merge --ff-only origin/develop
            echo "Deployed $(git rev-parse --short HEAD)"
