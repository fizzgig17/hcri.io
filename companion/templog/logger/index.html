<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temp Logger (infrared) - web logger</title>
<meta name="description" content="Log up to three MLX90614 infrared temperature sensors from a Raspberry Pi Pico in Chrome or Edge: live chart, recording and CSV.">
<link rel="canonical" href="https://www.hcri.io/companion/templog/logger/">
<style>
:root{--bg:#0b1220;--surface:#111a2b;--surface2:#16213a;--border:#25334f;--text:#e6edf7;--dim:#8da0bd;--accent:#35d0a0;--bad:#ff6b6b;--c1:#ff8a4c;--c2:#4cc3ff;--c3:#c58bff;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f6fa;--surface:#fff;--surface2:#eef2f8;--border:#cfd8e6;--text:#14202f;--dim:#55677f;--accent:#0a8f68;--bad:#c43b3b;--c1:#d9631f;--c2:#1b86c9;--c3:#8b4fd1;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
header h1{font-size:16px;margin:0;flex:1}header a{color:var(--accent);text-decoration:none}
main{max-width:1000px;margin:0 auto;padding:12px 16px 60px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 13px;border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-radius:7px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 24%,transparent)}.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}.btn.plain{background:transparent;border-color:var(--border);color:var(--text)}.btn.rec{background:color-mix(in srgb,var(--bad) 18%,transparent);border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;border-top:3px solid var(--c)}
.card input[type=text]{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font:inherit;font-size:13px}
.big{font-size:38px;font-weight:800;line-height:1.1;margin-top:6px}.big small{font-size:15px;color:var(--dim);font-weight:400}
.sub{color:var(--dim);font-size:12px}.em{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--dim)}
.em input{width:64px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font:inherit}
canvas{width:100%;height:320px;display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px}
select{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font:inherit}
#log{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;height:110px;overflow:auto;font-size:12px;color:var(--dim);white-space:pre-wrap}
.note{color:var(--dim);font-size:12.5px}.err{color:var(--bad)}
</style></head><body>
<header><h1>Temp Logger (infrared)</h1><a href="../">Build guide</a><button class="btn plain" id="theme" type="button">Theme</button></header>
<main>
<div class="row">
  <button class="btn" id="connect" type="button">Connect Pico</button>
  <button class="btn plain" id="sim" type="button">Simulate</button>
  <button class="btn" id="rec" type="button" disabled>Start recording</button>
  <button class="btn plain" id="csv" type="button" disabled>Download CSV</button>
  <button class="btn plain" id="clear" type="button">Clear chart</button>
  <label class="sub">Show <select id="win"><option value="120">2 min</option><option value="600" selected>10 min</option><option value="1800">30 min</option><option value="0">everything</option></select></label>
  <span class="sub" id="state">Not connected</span>
</div>
<div class="cards" id="cards"></div>
<canvas id="cv" width="1000" height="320"></canvas>
<p class="note" id="support"></p>
<div class="row"><strong>Messages</strong></div><div id="log"></div>
<p class="note">Temperatures are in &deg;C. Set the emissivity of each surface (anodized aluminum about 0.9, shiny bare metal much lower); it is saved on the Pico. This page needs Chrome or Edge on a computer.</p>
</main>
<script>
(function () {
  var N = 3, COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)'];
  var $ = function (id) { return document.getElementById(id); };
  var S = { port: null, reader: null, writer: null, sim: false, t: [], v: [[], [], []], amb: [[], [], []], last: null, rec: null, emis: [1, 1, 1], timer: null, t0: 0 };
  var labels = ['Sensor 1', 'Sensor 2', 'Sensor 3'];
  try { var sv = JSON.parse(localStorage.getItem('templog_labels') || 'null'); if (sv && sv.length === N) labels = sv; } catch (e) {}
  function cssVar(v) { return getComputedStyle(document.documentElement).getPropertyValue(v.replace(/var\((.*)\)/, '$1')).trim(); }

  // ---- cards ----
  var cards = $('cards');
  for (var i = 0; i < N; i++) (function (i) {
    var d = document.createElement('div'); d.className = 'card'; d.style.setProperty('--c', COLORS[i]); d.style.borderTopColor = COLORS[i];
    d.innerHTML = '<input type="text" maxlength="30" value="' + labels[i].replace(/"/g, '&quot;') + '" aria-label="Name of sensor ' + (i + 1) + '">' +
      '<div class="big" id="b' + i + '">--<small> &deg;C</small></div><div class="sub" id="a' + i + '">sensor chip --</div>' +
      '<div class="em">Emissivity <input type="number" min="0.1" max="1" step="0.01" value="1" id="e' + i + '" aria-label="Emissivity of sensor ' + (i + 1) + '"> <button class="btn plain" type="button" id="es' + i + '">Set</button></div>';
    cards.appendChild(d);
    d.querySelector('input[type=text]').onchange = function (e) { labels[i] = e.target.value || ('Sensor ' + (i + 1)); try { localStorage.setItem('templog_labels', JSON.stringify(labels)); } catch (x) {} draw(); };
    $('es' + i).onclick = function () { var e = parseFloat($('e' + i).value); if (!(e >= 0.1 && e <= 1)) { msg('Emissivity must be from 0.1 to 1.0'); return; } send('E ' + (i + 1) + ' ' + e); if (S.sim) { S.emis[i] = e; msg('Simulated: emissivity ' + (i + 1) + ' set to ' + e); } };
  })(i);

  function msg(t) { var l = $('log'); l.textContent += t + '\n'; l.scrollTop = l.scrollHeight; }
  function setState(t) { $('state').textContent = t; }
  function connected() { return !!(S.port || S.sim); }
  function buttons() { $('rec').disabled = !connected(); $('csv').disabled = !(S.rec && S.rec.rows.length) && !(S.lastRec && S.lastRec.rows.length); $('connect').textContent = S.port ? 'Disconnect' : 'Connect Pico'; $('sim').textContent = S.sim ? 'Stop simulating' : 'Simulate'; $('rec').textContent = S.rec ? 'Stop recording' : 'Start recording'; $('rec').className = 'btn' + (S.rec ? ' rec' : ''); }

  // ---- readings ----
  function num(s) { if (s === undefined || s === '') return null; var v = parseFloat(s); return isFinite(v) ? v : null; }
  function onLine(line) {
    line = line.trim(); if (!line) return;
    if (line[0] === '#') { msg(line.slice(1).trim()); var m = /emis=([0-9.,]+)/.exec(line); if (m) m[1].split(',').forEach(function (e, i) { if (i < N && $('e' + i) !== document.activeElement) $('e' + i).value = e; }); return; }
    if (line[0] !== 'T') return;
    var p = line.split(',');
    if (p.length < 2 + 2 * N) return;
    addReading(num(p[1]), [0, 1, 2].map(function (i) { return num(p[2 + i]); }), [0, 1, 2].map(function (i) { return num(p[2 + N + i]); }));
  }
  function addReading(t, objs, ambs) {
    if (t === null) return;
    if (S.t.length && t < S.t[S.t.length - 1]) { S.t = []; S.v = [[], [], []]; S.amb = [[], [], []]; }   // the Pico restarted
    S.t.push(t); for (var i = 0; i < N; i++) { S.v[i].push(objs[i]); S.amb[i].push(ambs[i]); }
    if (S.t.length > 20000) { S.t.splice(0, 2000); for (i = 0; i < N; i++) { S.v[i].splice(0, 2000); S.amb[i].splice(0, 2000); } }
    for (i = 0; i < N; i++) { $('b' + i).innerHTML = (objs[i] === null ? '--' : objs[i].toFixed(1)) + '<small> &deg;C</small>'; $('a' + i).textContent = 'sensor chip ' + (ambs[i] === null ? '--' : ambs[i].toFixed(1) + ' °C'); }
    if (S.rec) { S.rec.rows.push([new Date().toISOString(), t].concat(objs, ambs)); buttons(); }
    draw();
  }

  // ---- chart ----
  function draw() {
    var cv = $('cv'), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    var g = cv.getContext('2d'); g.scale(dpr, dpr); var W = r.width, H = r.height, L = 46, R = 12, T = 14, B = 26;
    g.clearRect(0, 0, W, H); g.font = '11px ui-monospace,monospace';
    var win = parseInt($('win').value, 10), n = S.t.length;
    if (!n) { g.fillStyle = cssVar('var(--dim)'); g.fillText('No readings yet. Connect the Pico or press Simulate.', L + 10, H / 2); return; }
    var tEnd = S.t[n - 1], tStart = win ? Math.max(S.t[0], tEnd - win) : S.t[0], i0 = 0;
    while (i0 < n - 1 && S.t[i0] < tStart) i0++;
    var lo = Infinity, hi = -Infinity;
    for (var s = 0; s < N; s++) for (var k = i0; k < n; k++) { var v = S.v[s][k]; if (v !== null) { if (v < lo) lo = v; if (v > hi) hi = v; } }
    if (!isFinite(lo)) { g.fillStyle = cssVar('var(--dim)'); g.fillText('No sensor is answering.', L + 10, H / 2); return; }
    var pad = Math.max(1, (hi - lo) * 0.1); lo = Math.floor(lo - pad); hi = Math.ceil(hi + pad);
    var span = Math.max(tEnd - tStart, 10);
    function X(t) { return L + (t - tStart) / span * (W - L - R); } function Y(v) { return T + (hi - v) / (hi - lo) * (H - T - B); }
    g.strokeStyle = cssVar('var(--border)'); g.fillStyle = cssVar('var(--dim)'); g.lineWidth = 1;
    var step = [1, 2, 5, 10, 20, 50].find(function (s2) { return (hi - lo) / s2 <= 6; }) || 100;
    for (var y = Math.ceil(lo / step) * step; y <= hi; y += step) { g.beginPath(); g.moveTo(L, Y(y)); g.lineTo(W - R, Y(y)); g.stroke(); g.fillText(y + '°', 6, Y(y) + 4); }
    g.fillText(Math.round(-span) + ' s', L, H - 8); g.fillText('now', W - R - 22, H - 8);
    for (s = 0; s < N; s++) {
      g.strokeStyle = cssVar(COLORS[s]); g.lineWidth = 2; g.beginPath(); var pen = false;
      for (k = i0; k < n; k++) { v = S.v[s][k]; if (v === null) { pen = false; continue; } if (!pen) { g.moveTo(X(S.t[k]), Y(v)); pen = true; } else g.lineTo(X(S.t[k]), Y(v)); }
      g.stroke(); g.fillStyle = cssVar(COLORS[s]); g.fillText(labels[s], L + 8 + s * 110, T + 12);
    }
  }

  // ---- serial ----
  function send(text) { if (S.writer) S.writer.write(new TextEncoder().encode(text + '\n')).catch(function () {}); }
  async function connect() {
    if (!navigator.serial) { msg('This browser has no serial access. Use Chrome or Edge on a computer.'); return; }
    try {
      S.port = await navigator.serial.requestPort(); await S.port.open({ baudRate: 115200 });
    } catch (e) { S.port = null; msg('Could not open the port: ' + (e && e.message || e)); buttons(); return; }
    setState('Connected'); buttons(); stopSim();
    S.writer = S.port.writable.getWriter(); var dec = new TextDecoder(), buf = '';
    S.reader = S.port.readable.getReader(); msg('Connected.'); send('?');
    try { for (;;) { var r = await S.reader.read(); if (r.done) break; buf += dec.decode(r.value, { stream: true }); var ls = buf.split('\n'); buf = ls.pop(); ls.forEach(onLine); } } catch (e) { msg('Lost the connection: ' + (e && e.message || e)); }
    await disconnect(true);
  }
  async function disconnect(lost) {
    try { if (S.reader) { await S.reader.cancel().catch(function () {}); S.reader.releaseLock(); } } catch (e) {}
    try { if (S.writer) S.writer.releaseLock(); } catch (e) {}
    try { if (S.port) await S.port.close(); } catch (e) {}
    S.port = S.reader = S.writer = null; if (S.rec) stopRec(); setState(lost ? 'Connection lost' : 'Not connected'); buttons();
  }
  // ---- simulation ----
  function startSim() {
    S.sim = true; S.t0 = performance.now(); setState('Simulating'); buttons(); msg('Simulating three sensors.');
    S.timer = setInterval(function () {
      var t = (performance.now() - S.t0) / 1000, objs = [], ambs = [];
      for (var i = 0; i < N; i++) { var base = 24 + i * 3, rise = [38, 22, 12][i] * (1 - Math.exp(-t / (90 + i * 40))); objs.push(base + rise + Math.sin(t / 7 + i) * 0.15 + (Math.random() - 0.5) * 0.1); ambs.push(24 + i * 0.4 + rise * 0.05); }
      var r2 = function (v) { return Math.round(v * 100) / 100; };
      addReading(Math.round(t * 10) / 10, objs.map(r2), ambs.map(r2));
    }, 1000);
  }
  function stopSim() { if (S.timer) clearInterval(S.timer); S.timer = null; if (S.sim) { S.sim = false; if (S.rec) stopRec(); setState(S.port ? 'Connected' : 'Not connected'); buttons(); } }

  // ---- recording and CSV ----
  function stopRec() { S.lastRec = S.rec; S.rec = null; msg('Recording stopped: ' + S.lastRec.rows.length + ' readings.'); buttons(); }
  function csvText(rec) {
    var h = ['time_iso', 'seconds'].concat(labels.map(function (l) { return l + ' object C'; }), labels.map(function (l) { return l + ' sensor C'; }));
    return [h.map(function (c) { return '"' + c.replace(/"/g, '""') + '"'; }).join(',')].concat(rec.rows.map(function (r) { return r.map(function (c) { return c === null ? '' : c; }).join(','); })).join('\n') + '\n';
  }
  $('rec').onclick = function () { if (S.rec) stopRec(); else { S.rec = { rows: [], start: new Date() }; msg('Recording started.'); buttons(); } };
  $('csv').onclick = function () {
    var rec = (S.rec && S.rec.rows.length) ? S.rec : S.lastRec; if (!rec || !rec.rows.length) return;
    var a = document.createElement('a'), d = rec.start, p = function (n) { return ('0' + n).slice(-2); };
    a.href = URL.createObjectURL(new Blob([csvText(rec)], { type: 'text/csv' }));
    a.download = 'Temps_' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + '.' + p(d.getMinutes()) + '.' + p(d.getSeconds()) + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  };
  $('connect').onclick = function () { if (S.port) disconnect(false); else connect(); };
  $('sim').onclick = function () { if (S.sim) stopSim(); else if (S.port) msg('Disconnect the Pico first.'); else startSim(); };
  $('clear').onclick = function () { S.t = []; S.v = [[], [], []]; S.amb = [[], [], []]; for (var i = 0; i < N; i++) { $('b' + i).innerHTML = '--<small> &deg;C</small>'; $('a' + i).textContent = 'sensor chip --'; } S.t0 = performance.now(); draw(); };
  $('win').onchange = draw; window.addEventListener('resize', draw);
  $('theme').onclick = function () { var h = document.documentElement; h.setAttribute('data-theme', h.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); try { localStorage.setItem('hcri_theme', h.getAttribute('data-theme')); } catch (e) {} draw(); };
  try { var th = localStorage.getItem('hcri_theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
  window.addEventListener('beforeunload', function (e) { if (S.rec && S.rec.rows.length) { e.preventDefault(); e.returnValue = ''; } });
  $('support').textContent = navigator.serial ? '' : 'This browser cannot talk to the Pico. Use Chrome or Edge on a computer (you can still try Simulate).';
  buttons(); draw();
})();
</script></body></html>
