<!-- help/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help &amp; Reference · hCRI.io</title>
<meta name="robots" content="all">
<meta name="description" content="Help and reference for hCRI.io: uploading readings, CRI and TM-30, reports, sharing, flicker and the API.">
<script>
  (function(){
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('hcri_theme') || 'dark'); } catch (e) {}
  })();
</script>
<style>
  :root{ --bg:#eef2f7; --surface:#fff; --text:#0d1f30; --dim:#4a6480; --border:#d4deea; --accent:#005baa; --warn:#a15c00; }
  :root[data-theme="dark"]{ --bg:#060a0f; --surface:#0a1628; --text:#e8f4ff; --dim:#7aaccc; --border:rgba(80,160,220,0.25); --accent:#00d4ff; --warn:#ffcc33; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:780px;margin:0 auto;padding:28px 20px 80px;}
  header{display:flex;align-items:center;justify-content:space-between}
  header a.brand{font-weight:900;font-size:20px;color:var(--text);text-decoration:none;font-family:monospace}
  header a.brand .io{color:var(--accent)}
  h1{font-size:26px;margin:18px 0 6px}
  a{color:var(--accent)}
  .lede{color:var(--dim);margin:0 0 22px}
  .pdf{display:inline-block;margin:0 0 22px;font-weight:700}
  details{border:1px solid var(--border);border-radius:10px;background:var(--surface);margin:0 0 10px;padding:0}
  details[open]{border-color:var(--accent)}
  summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--dim);font-weight:400}
  details[open] summary::after{content:"\2212"}
  .body{padding:0 16px 16px;white-space:pre-line;color:var(--text);font-size:15px;line-height:1.75}
  .back{display:inline-block;margin-top:30px;color:var(--accent);text-decoration:none;font-weight:600}
  .err{color:var(--dim)}
</style>
<link rel="stylesheet" href="/assets/site-pages.css">
<script defer src="/assets/site-pages.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">hCRI<span class="io">.io</span></a>
    <button id="theme-toggle" type="button" title="Toggle light/dark" aria-label="Toggle light/dark theme">🌙</button>
  </header>
  <div class="bar"></div>

  <h1>Help &amp; Reference</h1>
  <p class="lede">Everything about uploading readings, reading the reports, sharing and the API. Tap a topic to open it.</p>
  <a class="pdf" href="/hCRI.io%20-%20Complete%20Guide.pdf">↓ Download the complete hCRI.io PDF guide</a>

  <div id="topics"><p class="err">Loading help topics…</p></div>
  <noscript><p class="err">Help topics need JavaScript. You can also download the complete PDF guide above.</p></noscript>

  <a class="back" href="/">← Back to hCRI.io</a>
</div>
<script>
  (function () {
    var root = document.getElementById('topics');
    function slug(t) { return (t || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
    function show(list) {
      root.textContent = '';
      var want = '';
      try { want = new URLSearchParams(location.search).get('help') || location.hash.replace(/^#/, ''); } catch (e) {}
      list.forEach(function (t, i) {
        if (!t || !t.title) return;
        var d = document.createElement('details');
        d.id = slug(t.title);
        var s = document.createElement('summary'); s.textContent = t.title;
        var b = document.createElement('div'); b.className = 'body'; b.textContent = t.content || '';
        d.appendChild(s); d.appendChild(b);
        if (want ? d.id === want : i === 0) d.open = true;
        root.appendChild(d);
        if (want && d.id === want) setTimeout(function () { d.scrollIntoView(); }, 0);
      });
    }
    function fail() { root.innerHTML = '<p class="err">Help topics couldn’t be loaded right now. You can download the complete PDF guide above.</p>'; }
    function load(url) {
      return fetch(url, { cache: 'no-cache' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (d) { if (!Array.isArray(d) || !d.length) throw new Error('empty'); return d; });
    }
    load('/help_content.json').then(show).catch(fail);
  })();
</script>
<script>
  (function(){
    var btn = document.getElementById('theme-toggle'), html = document.documentElement;
    function sync(){ btn.textContent = html.getAttribute('data-theme') === 'dark' ? '\u2600' : '\uD83C\uDF19'; }
    sync();
    btn.addEventListener('click', function(){
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try { localStorage.setItem('hcri_theme', next); } catch (e) {}
      sync();
    });
  })();
</script>
</body>
</html>
